<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Sachidanandam — Product Engineer, Sustainability Strategist &amp; Founder of Forge</title>
<meta name="description" content="Portfolio of Sachidanandam: footwear product engineer (Puma &amp; Comet at Tata International), MBA aspirant in marketing and sustainability, and founder of Forge, a portfolio and business website studio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Noto+Sans+Tamil:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#f4f1ea;--mute:#8d918e;--acc:#00e5a0;--line:rgba(244,241,234,.16);--f:Poppins,system-ui,sans-serif;--tam:"Noto Sans Tamil",var(--f);box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:300 16px/1.65 var(--f);overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:4px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.top,#view,footer{position:relative;z-index:2}
h1,h2,h3{font-weight:600;letter-spacing:-.035em;line-height:1}
.k{font:500 11px var(--f);letter-spacing:.28em;text-transform:uppercase;color:var(--acc);display:block;margin-bottom:20px}
.pg{padding:150px 6% 90px;min-height:100vh}
h2.t{font-size:clamp(40px,7vw,104px)}h2.t i{font-style:normal;color:var(--acc)}
/* gate */
.gate{position:fixed;inset:0;z-index:300;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;transition:opacity 1.2s,visibility 1.2s;padding:20px}
.gate.off{opacity:0;visibility:hidden}
.gate .ta{font:500 clamp(38px,8vw,88px)/1 var(--tam);animation:fl 4s ease-in-out infinite}
.gate .la{font:600 clamp(28px,5vw,60px)/1 var(--f);letter-spacing:-.04em}
.gate p{color:var(--mute);font-size:12px;letter-spacing:.22em;text-transform:uppercase}
.gb{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.b{border:1px solid var(--ink);background:none;border-radius:99px;padding:14px 28px;cursor:pointer;font-weight:500;font-size:14px;transition:background .3s,color .3s,border-color .3s;display:inline-flex;align-items:center;gap:8px}
.b:hover,.b.f{background:var(--ink);color:#000}.b.a{border-color:var(--acc);color:var(--acc)}.b.a:hover{background:var(--acc);color:#000}
@keyframes fl{50%{transform:translateY(-8px);opacity:.8}}
/* top bar */
.top{position:fixed;inset:0 0 auto;z-index:150;display:flex;justify-content:space-between;align-items:center;padding:20px 3.2%;pointer-events:none}
.top>*{pointer-events:auto}
.logo{display:block;font-weight:600;font-size:clamp(20px,2.2vw,30px);letter-spacing:-.04em;line-height:1}.logo small{display:block;font-size:12px;font-weight:500;color:var(--mute);letter-spacing:0;margin-bottom:6px}
.nav{display:flex;gap:30px;align-items:center;font-weight:500;font-size:15px}
.nav a.l{opacity:.85;transition:opacity .3s,color .3s}.nav a.l:hover,.nav a.l.on{opacity:1;color:var(--acc)}
.pill{background:var(--ink);color:#000;border-radius:99px;padding:15px 28px;font-weight:600;font-size:15px;box-shadow:0 0 50px rgba(255,190,90,.22);transition:transform .3s,box-shadow .3s}.pill:hover{transform:translateY(-2px);box-shadow:0 0 60px rgba(255,190,90,.4)}
.snd{background:none;border:0;cursor:pointer;display:flex;gap:3px;align-items:flex-end;height:20px;width:30px}
.snd i{width:2px;background:var(--ink);height:100%;animation:eq 1s ease-in-out infinite}.snd i:nth-child(2){animation-delay:.2s}.snd i:nth-child(3){animation-delay:.45s}.snd i:nth-child(4){animation-delay:.1s}.snd i:nth-child(5){animation-delay:.3s}
.snd.mute i{animation:none;height:3px}
@keyframes eq{0%,100%{height:20%}50%{height:100%}}
.ham{display:none;background:none;border:0;cursor:pointer;font-weight:500}
.adminbtn{display:none}.adm .adminbtn{display:inline-flex}
/* wipe */
.wipe{position:fixed;inset:0;background:#0a0d0c;z-index:200;transform:translateY(100%);pointer-events:none;display:flex;align-items:center;justify-content:center;font:600 clamp(30px,6vw,80px)/1 var(--f);letter-spacing:-.04em;color:var(--acc)}
/* hero */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:110px 6% 60px;position:relative}
.cities{position:absolute;inset:48% 3.2% auto;display:flex;justify-content:space-between;transform:translateY(-50%);pointer-events:none;font:500 clamp(18px,2.6vw,38px)/1 var(--f);letter-spacing:-.03em}
.cities small{display:block;font:300 11px var(--f);letter-spacing:.22em;color:var(--mute);margin-top:10px}
.portal{position:relative;width:min(320px,64vw);aspect-ratio:3/4;border-radius:999px 999px 16px 16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 0 140px -30px rgba(0,229,160,.5);transform:perspective(900px) rotateY(var(--ry,0deg)) rotateX(var(--rx,0deg));transition:transform .25s;background:#0b0e0d}
.portal img{width:100%;height:100%;object-fit:cover;display:block}
.nm{font:600 clamp(40px,11.4vw,200px)/.82 var(--f);letter-spacing:-.06em;margin-top:-.3em;position:relative;z-index:2;mix-blend-mode:difference;color:#fff;white-space:nowrap}
.nm span{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}.nm span b{display:inline-block;font-weight:inherit;transform:translateY(108%);transition:transform 1.4s cubic-bezier(.16,1,.3,1)}
.go .nm span b{transform:none}
.role{max-width:600px;margin-top:30px;color:#c8c5bd;font-size:clamp(14px,1.3vw,17px)}.role b{color:var(--ink);font-weight:500}
.scr{margin-top:34px;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:12px}
.scr:after{content:"";width:20px;height:34px;border:1px solid var(--mute);border-radius:12px;background:radial-gradient(circle at 50% 20%,var(--acc) 3px,transparent 4px);animation:ms 1.8s infinite}
@keyframes ms{50%{background-position:0 14px}}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:40px 6% 100px}
.tile{border:1px solid var(--line);border-radius:14px;padding:34px;min-height:300px;display:flex;flex-direction:column;justify-content:space-between;background:rgba(10,13,12,.7);backdrop-filter:blur(8px);transition:transform .6s cubic-bezier(.16,1,.3,1),border-color .3s,background .3s}
.tile:hover{transform:translateY(-10px);border-color:var(--acc);background:rgba(0,229,160,.06)}
.tile span{font-size:12px;letter-spacing:.2em;color:var(--acc)}.tile h3{font-size:clamp(34px,4vw,56px);margin-bottom:10px}.tile p{color:#b9b6ad;font-size:14px}
.tile b{align-self:flex-end;font-size:26px;font-weight:400;transition:transform .4s}.tile:hover b{transform:translate(6px,-6px)}
.cta{text-align:center;padding:60px 6% 120px}.cta h2{font-size:clamp(34px,6vw,86px);max-width:1000px;margin:0 auto 34px}
/* works stage */
.stage{position:fixed;inset:0;z-index:3;background:#000}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;transition:opacity .5s}.stage.sw canvas{opacity:0}
.stage:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,.7));pointer-events:none}
.wt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2;pointer-events:none;padding:0 8%;transition:opacity .4s,transform .6s}
.stage.sw .wt{opacity:0;transform:translateY(24px)}
.wt small{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:16px}.wt h1{font-size:clamp(46px,9vw,140px);text-shadow:0 4px 60px rgba(0,0,0,.7)}.wt p{max-width:520px;color:#d0cdc4;margin-top:18px;font-size:15px}
.pn{position:absolute;bottom:34px;z-index:3;background:none;border:0;cursor:pointer;max-width:34%}.pn small{display:block;font-size:13px;color:var(--mute);letter-spacing:.1em}.pn b{font-size:clamp(20px,2.4vw,34px);font-weight:600;letter-spacing:-.03em;transition:color .3s}.pn:hover b{color:var(--acc)}
.pn.p{left:3.2%;text-align:left}.pn.n{right:3.2%;text-align:right}
.visit{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);z-index:3;border:1px solid var(--line);background:rgba(20,22,21,.7);backdrop-filter:blur(10px);border-radius:99px;padding:18px 34px;font-weight:500;font-size:15px;color:#cfccc3;display:flex;gap:14px;align-items:center;transition:background .3s,color .3s}.visit:hover{background:var(--ink);color:#000}
.cnt{position:absolute;top:110px;left:3.2%;z-index:3;font-size:13px;letter-spacing:.2em;color:var(--mute)}
/* work detail */
.dh{position:relative;height:78vh;min-height:460px}.dh canvas{position:absolute;inset:0;width:100%;height:100%}
.dh:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,#000)}
.dh .wt{justify-content:flex-end;align-items:flex-start;text-align:left;padding:0 6% 50px}
.dd{padding:30px 6% 80px}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;border-top:1px solid var(--line);padding-top:26px;margin-bottom:60px}.meta small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}.meta b{font-weight:500;font-size:15px}
.sr{display:grid;grid-template-columns:200px 1fr;gap:30px;padding:34px 0;border-top:1px solid var(--line)}.sr h3{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);font-weight:500}.sr p{font-size:clamp(18px,2vw,28px);line-height:1.35;letter-spacing:-.02em;max-width:900px}
.bd{display:flex;gap:10px;flex-wrap:wrap;margin:34px 0}.bd span{border:1px solid var(--line);border-radius:99px;padding:6px 16px;font-size:13px;color:#d6d3ca}
.pnav{display:flex;justify-content:space-between;gap:20px;padding:50px 6%;border-top:1px solid var(--line)}.pnav a small{display:block;font-size:12px;color:var(--mute);letter-spacing:.1em}.pnav a b{font-size:clamp(22px,3vw,40px);font-weight:600;letter-spacing:-.03em}.pnav a:hover b{color:var(--acc)}
/* about */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:44px 0 54px}.tabs button{border:1px solid var(--line);background:none;border-radius:99px;padding:10px 22px;cursor:pointer;font-size:14px;transition:.3s}.tabs button.on,.tabs button:hover{background:var(--ink);color:#000;border-color:var(--ink)}
.ab{display:grid;grid-template-columns:1.4fr 1fr;gap:6%;align-items:start}
.big{font:500 clamp(24px,3vw,44px)/1.2 var(--f);letter-spacing:-.03em}
.facts{border-top:1px solid var(--line)}.facts div{padding:16px 0;border-bottom:1px solid var(--line)}.facts small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}.facts b{font-weight:500;font-size:15px}
.chap{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:60px}.chap h3{font-size:24px;margin-bottom:10px}.chap p{color:#b9b6ad;font-size:15px}
.stats{display:flex;gap:56px;margin-top:56px;flex-wrap:wrap}.stats b{display:block;font-size:clamp(46px,6vw,88px);font-weight:600;letter-spacing:-.05em;line-height:1;color:var(--acc)}.stats span{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--mute)}
.sk{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}.sg{border-top:1px solid var(--line);padding-top:22px}.sg .ic{font-size:26px}.sg h3{font-size:22px;margin:12px 0 18px}
.pl{display:flex;flex-wrap:wrap;gap:8px}.pl span{border:1px solid var(--line);border-radius:99px;padding:4px 13px;font-size:12px;color:#c3c0b6;transition:.3s}.pl span:hover{background:var(--acc);color:#000;border-color:var(--acc)}
.er{display:grid;grid-template-columns:210px 1fr 1fr;gap:30px;padding:32px 0;border-top:1px solid var(--line);align-items:baseline;position:relative}.er time{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}.er h3{font-size:clamp(24px,2.8vw,38px)}.er p{color:#b9b6ad;font-size:14px}
.ce{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}.ce span{border:1px solid var(--line);border-radius:8px;padding:12px 18px;font-size:14px;position:relative}
.ac{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.ach{border:1px solid var(--line);border-radius:12px;padding:30px;position:relative;background:rgba(10,13,12,.7);transition:transform .5s cubic-bezier(.16,1,.3,1),border-color .3s}.ach:hover{transform:translateY(-10px);border-color:var(--acc)}.ach .ic{font-size:34px;margin-bottom:16px}.ach h3{font-size:20px;line-height:1.15;margin-bottom:10px}.ach p{font-size:13px;color:#b9b6ad}
/* forge */
.fh{display:grid;grid-template-columns:1.3fr 1fr;gap:6%;align-items:end}.fh p{color:#c8c5bd;font-size:17px;margin:26px 0 30px;max-width:560px}
.terr{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:70px 0}.terr div{border-top:1px solid var(--acc);padding-top:18px}.terr h3{font-size:24px;margin-bottom:8px}.terr p{font-size:14px;color:#b9b6ad}
.ptabs{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:5px;margin:30px 0 36px}.ptabs button{background:none;border:0;border-radius:99px;padding:11px 26px;cursor:pointer;font-weight:500;transition:.3s}.ptabs button.on{background:var(--ink);color:#000}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.plan{border:1px solid var(--line);border-radius:18px;padding:34px;display:flex;flex-direction:column;background:rgba(10,13,12,.75);transition:transform .5s cubic-bezier(.16,1,.3,1),border-color .3s}.plan:hover{transform:translateY(-8px);border-color:var(--acc)}.plan.hi{background:var(--ink);color:#000}
.plan h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}.pr{font-size:54px;font-weight:600;letter-spacing:-.05em;margin:14px 0 6px}.plan>p{color:#8d918e;font-size:14px;margin-bottom:18px}.plan.hi>p{color:#444}
.plan ul{list-style:none;flex:1;margin-bottom:24px;border-top:1px solid var(--line)}.plan.hi ul{border-color:#bbb}.plan li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.plan.hi li{border-color:#d4d0c6}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:70px 0 50px}.steps div{border-top:1px solid var(--line);padding-top:20px}.steps b{font-size:60px;font-weight:600;color:var(--acc);letter-spacing:-.05em;display:block;line-height:1}.steps h3{font-size:20px;margin:14px 0 8px}.steps p{font-size:14px;color:#b9b6ad}
/* contact scheduler */
.sch{display:grid;grid-template-columns:300px 1fr 330px;border:1px solid var(--line);border-radius:14px;background:rgba(8,10,10,.88);backdrop-filter:blur(12px);max-width:1280px;margin:0 auto;min-height:540px}
.sch>div{padding:28px}.sch>div+div{border-left:1px solid var(--line)}
.sch .av{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:center 20%;border:1px solid var(--line);margin-bottom:12px}
.sch h3{font-size:24px;margin:6px 0 16px}.sch li{list-style:none;display:flex;gap:10px;margin-bottom:14px;color:#c8c5bd;font-size:14px;align-items:center}
.cm{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;font-size:18px;font-weight:600}.cm span{color:var(--mute);font-weight:400}.cm button{background:none;border:0;cursor:pointer;font-size:20px;padding:4px 12px;opacity:.8}.cm button:disabled{opacity:.25;cursor:default}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.cg .h{font-size:12px;font-weight:600;letter-spacing:.08em;padding:10px 0 16px}
.cg{grid-auto-rows:min-content}.cg button{width:100%;height:46px;padding:0;border:0;border-radius:8px;background:none;color:#7e827f;font-size:15px;position:relative}.cg button.ok{background:#262826;color:var(--ink);font-weight:600;cursor:pointer;transition:background .2s,transform .2s}.cg button.ok:hover{background:#3a3d3b;transform:scale(1.05)}.cg button.sel{background:var(--ink);color:#000}.cg button.td:after{content:"";position:absolute;bottom:8px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-weight:600;font-size:18px}.hz{display:flex;background:#1a1c1b;border-radius:8px;padding:3px}.hz button{background:none;border:0;border-radius:6px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--mute)}.hz button.on{background:#000;color:var(--ink)}
.sl{display:grid;gap:10px}.sl button{background:#000;border:1px solid var(--line);border-radius:8px;padding:12px;font-weight:500;cursor:pointer;transition:.2s}.sl button:hover{border-color:var(--acc);color:var(--acc)}
.fg{margin-bottom:12px}.fg label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:5px}.fg input,.fg textarea,.fg select{width:100%;background:#000;border:1px solid var(--line);color:var(--ink);padding:10px 14px;border-radius:8px;font:inherit;font-size:14px}
.note{font-size:12px;color:var(--mute);text-align:center;margin-top:22px}
.oc{text-align:center;margin-top:34px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
footer{padding:26px 3.2% 34px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mute);border-top:1px solid var(--line);background:#000}
.cur{position:fixed;left:0;top:0;width:40px;height:40px;margin:-20px;border:1px solid var(--ink);border-radius:50%;pointer-events:none;z-index:400;mix-blend-mode:difference;display:none;align-items:center;justify-content:center;font-size:10px;letter-spacing:.12em;text-transform:uppercase;transition:width .3s,height .3s,margin .3s,background .3s;color:#000}.cur.h{width:76px;height:76px;margin:-38px;background:#fff}
@media(pointer:fine){.cur{display:flex}}
.ov{position:fixed;inset:0;z-index:250;background:rgba(0,0,0,.88);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center}.ov.open{display:flex}
.md{background:#0b0e0d;border:1px solid var(--line);border-radius:14px;padding:36px;width:92%;max-width:560px;max-height:88vh;overflow:auto;position:relative}.md h3{font-size:28px;margin-bottom:6px}.md .x{position:absolute;right:16px;top:12px;background:none;border:0;font-size:22px;cursor:pointer;color:var(--mute)}
.tb{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.tb .b{padding:6px 14px;font-size:12px}
.del{position:absolute;top:8px;right:10px;background:none;border:0;color:#ff5c5c;cursor:pointer;display:none;z-index:5}.adm .del{display:block}
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,80px);background:var(--acc);color:#000;padding:12px 24px;border-radius:99px;font-weight:600;font-size:13px;z-index:500;opacity:0;transition:.4s}.toast.show{transform:translate(-50%,0);opacity:1}
.rv{opacity:0;transform:translateY(40px);transition:opacity .9s,transform .9s cubic-bezier(.16,1,.3,1)}.rv.in{opacity:1;transform:none}
@media(max-width:1000px){.sch{grid-template-columns:1fr}.sch>div+div{border-left:0;border-top:1px solid var(--line)}.ab,.chap,.er,.fh,.sr{grid-template-columns:1fr}.sk,.ac,.terr,.steps{grid-template-columns:1fr 1fr}.plans,.tiles{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}}
@media(max-width:800px){.nav{display:none;position:fixed;inset:0;background:#000;flex-direction:column;justify-content:center;font-size:26px;gap:26px}.nav.open{display:flex}.ham{display:block;position:relative;z-index:160}.cities{display:none}.pn b{font-size:18px}.visit{padding:14px 22px;font-size:13px;bottom:100px}.pn{bottom:30px}.top .logo{position:relative;z-index:160}}
@media(max-width:560px){.sk,.ac,.terr,.steps{grid-template-columns:1fr}.pg{padding-top:120px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}.rv,.nm span b{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas><div class="cur" id="cur"></div>
<div class="gate" id="gate" role="dialog" aria-label="Welcome">
  <div class="ta">சச்சிதானந்தம்</div><div class="la">Sachidanandam</div>
  <p>Product engineering · Sustainability · Forge</p>
  <div class="gb"><button class="b f" id="gOn">Click to enable sound</button><button class="b" id="gOff">Continue without sound</button></div>
</div>
<header class="top">
  <a class="logo" href="#/" data-s>SACHIDANANDAM</a>
  <nav class="nav" id="nav">
    <button class="snd" id="snd" aria-label="Toggle sound"><i></i><i></i><i></i><i></i><i></i></button>
